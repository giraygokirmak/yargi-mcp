services:
  yargi-mcp:
    build: .
    image: yargi-mcp:latest
    container_name: yargi-mcp
    restart: unless-stopped
    # Image'daki non-root kullanıcının uid/gid'i; `/app/logs` (named volume)
    # bu kimliğe sahip olarak mount edilir, PermissionError önlenir.
    user: "10001:10001"
    ports:
      - "8890:8890"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8890
    volumes:
      - yargi-logs:/app/logs

volumes:
  yargi-logs:
